paths:
  /auth/register:
    post:
      tags:
        - "auth"
      summary: "Регистрация нового студента (доступно всем ролям)"
      description: "Публичный эндпоинт регистрации исключительно для студентов. Создание преподавателей и администраторов доступно только администраторам системы."
      parameters: []
      responses:
        201:
          description: "models.AuthResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                success: true
                message: "Аутентификация успешна."
                data:
                  access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiJ1c3ItMSIsInJvbGUiOiJhZG1pbiJ9..."
                  user:
                    id: "usr-uuid-1"
                    email: "admin@course-platform.local"
                    full_name: "Администратор Системы"
                    role:
                      id: "role-uuid-admin"
                      name: "admin"
                      description: "Полный администратор платформы"
                      permissions:
                        - "users:view_all"
                        - "users:manage_roles"
                        - "roles:manage"
                        - "courses:create"
                        - "payments:view_all"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "VALIDATION_ERROR"
                  message: "Неверные параметры запроса."
        403:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "VALIDATION_ERROR"
                  message: "Неверные параметры запроса."
        409:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "VALIDATION_ERROR"
                  message: "Неверные параметры запроса."
      requestBody:
        required: true
        description: "Данные регистрации студента"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterStudentRequest"
            example:
              email: "student@example.com"
              password: "StudentSecurePass123!"
              full_name: "Иван Иванов"
              role: "student"
  /auth/login:
    post:
      tags:
        - "auth"
      summary: "Вход в систему"
      description: "Аутентификация с защитой от брутфорса (блокировка на 15 мин после 5 попыток)"
      parameters: []
      responses:
        200:
          description: "models.AuthResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                success: true
                message: "Аутентификация успешна."
                data:
                  access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiJ1c3ItMSIsInJvbGUiOiJhZG1pbiJ9..."
                  user:
                    id: "usr-uuid-1"
                    email: "admin@course-platform.local"
                    full_name: "Администратор Системы"
                    role:
                      id: "role-uuid-admin"
                      name: "admin"
                      description: "Полный администратор платформы"
                      permissions:
                        - "users:view_all"
                        - "users:manage_roles"
                        - "roles:manage"
                        - "courses:create"
                        - "payments:view_all"
        401:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "VALIDATION_ERROR"
                  message: "Неверные параметры запроса."
        423:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "VALIDATION_ERROR"
                  message: "Неверные параметры запроса."
      requestBody:
        required: true
        description: "Учетные данные"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "admin@course-platform.local"
              password: "AdminSecurePass123!"
  /auth/refresh:
    post:
      tags:
        - "auth"
      summary: "Обновить Access Token"
      description: "Выпуск нового токена по Refresh Token из HttpOnly cookie"
      parameters: []
      responses:
        200:
          description: "models.TokenResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                success: true
                data:
                  access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiJ1c3ItMSIsInJvbGUiOiJzdHVkZW50In0..."
        401:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "VALIDATION_ERROR"
                  message: "Неверные параметры запроса."
  /auth/logout:
    post:
      tags:
        - "auth"
      summary: "Выход из системы"
      description: "Очистка сессионных cookie"
      parameters: []
      responses:
        200:
          description: "models.SuccessResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: "Операция успешно выполнена."
      security:
        - bearerAuth: []
  /auth/me:
    get:
      tags:
        - "auth"
      summary: "Текущий аутентифицированный пользователь"
      description: "Возвращает профиль текущего пользователя и его актуальные права (RBAC)"
      parameters: []
      responses:
        200:
          description: "models.CurrentUserResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
              example:
                success: true
                data:
                  id: "usr-uuid-1"
                  email: "admin@course-platform.local"
                  full_name: "Администратор Системы"
                  role:
                    id: "role-uuid-admin"
                    name: "admin"
                    description: "Полный администратор платформы"
                    permissions:
                      - "users:view_all"
                      - "users:manage_roles"
                      - "roles:manage"
                      - "courses:create"
                      - "payments:view_all"
                  created_at: "2026-10-04T00:00:00.000Z"
        401:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "VALIDATION_ERROR"
                  message: "Неверные параметры запроса."
      security:
        - bearerAuth: []
  /cards:
    get:
      tags:
        - "cards"
      summary: "Сохраненные банковские карты"
      description: "Безопасный просмотр масок карт без раскрытия шифротекста (OWASP A02, разрешение cards:manage)"
      parameters: []
      responses:
        200:
          description: "models.CardListResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardListResponse"
              example:
                success: true
                data:
                  - id: "card-1"
                    card_holder: "IVAN IVANOV"
                    last4: "5678"
                    exp_month: "12"
                    exp_year: "28"
                    is_default: true
      security:
        - bearerAuth: []
    post:
      tags:
        - "cards"
      summary: "Привязать банковскую карту"
      description: "Шифрование данных карты по алгоритму AES-256-GCM с контролем целостности (разрешение cards:manage)"
      parameters: []
      responses:
        201:
          description: "models.CardResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
              example:
                success: true
                message: "Банковская карта успешно привязана (данные зашифрованы алгоритмом AES-256-GCM)."
                data:
                  id: "card-1"
                  card_holder: "IVAN IVANOV"
                  last4: "5678"
                  exp_month: "12"
                  exp_year: "28"
                  is_default: true
                  created_at: "2026-10-04T04:00:00.000Z"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "VALIDATION_ERROR"
                  message: "Неверные параметры запроса."
      requestBody:
        required: true
        description: "Реквизиты карты"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCardRequest"
            example:
              card_number: "4532758812345678"
              card_holder: "IVAN IVANOV"
              exp_month: "12"
              exp_year: "2028"
              cvv: "789"
              is_default: true
      security:
        - bearerAuth: []
  /cards/{id}:
    delete:
      tags:
        - "cards"
      summary: "Удалить карту"
      description: "Удаление привязанной карты (разрешение cards:manage)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Card ID"
          schema:
            type: "string"
            example: "c1a2b3c4-d5e6-7f8a-9b0c-1d2e3f4a5b6c"
          example: "c1a2b3c4-d5e6-7f8a-9b0c-1d2e3f4a5b6c"
