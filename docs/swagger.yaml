openapi: "3.0.3"
info:
  title: "Course & Training Management System API (ИПР №1)"
  version: "1.0.0"
  description: "Безопасный REST API для системы управления курсами, личным кабинетом студента, кабинетом преподавателя и динамическим RBAC (Role-Based Access Control). Спецификация сгенерирована из декларативных аннотаций Swaggo (// Method Godoc, @Summary, @Description, @Tags, @Param, @Success, @Failure, @Router) в контроллерах."
servers:
  - url: "/api/v1"
    description: "API v1 Base Endpoint"
tags:
  - name: "auth"
    description: "Регистрация, вход, refresh токенов и аудит безопасности (OWASP A07)"
  - name: "users"
    description: "Управление пользователями и связанными курсами (Только Администратор)"
  - name: "roles"
    description: "Управление ролями и динамическими атомарными правами (Dynamic RBAC)"
  - name: "courses"
    description: "Каталог, создание и управление курсами (право courses:create)"
  - name: "instructors"
    description: "Профили преподавателей и просмотр записанных студентов"
  - name: "enrollments"
    description: "Запись на курсы и управление заявками"
  - name: "cards"
    description: "Привязка и безопасное хранение карт (AES-256-GCM, OWASP A02)"
  - name: "payments"
    description: "Оплата курсов и реестр финансовых транзакций"
  - name: "system"
    description: "Health check и метрики производительности"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Введите JWT Access токен (Bearer <token>)"
  schemas:
    RegisterRequest:
      type: "object"
      required:
        - "email"
        - "password"
        - "full_name"
        - "role"
      properties:
        email:
          type: "string"
          format: "email"
          example: "student@example.com"
        password:
          type: "string"
          minLength: 8
          example: "StudentSecurePass123!"
        full_name:
          type: "string"
          example: "Иван Иванов"
        role:
          type: "string"
          enum:
            - "student"
          example: "student"
          description: "Обязательная роль пользователя (student)"
      example:
        email: "student@example.com"
        password: "StudentSecurePass123!"
        full_name: "Иван Иванов"
        role: "student"
    RegisterStudentRequest:
      type: "object"
      required:
        - "email"
        - "password"
        - "full_name"
      properties:
        email:
          type: "string"
          format: "email"
          example: "student@example.com"
        password:
          type: "string"
          minLength: 8
          example: "StudentSecurePass123!"
        full_name:
          type: "string"
          example: "Иван Иванов"
        role:
          type: "string"
          enum:
            - "student"
          default: "student"
          example: "student"
          description: "Роль пользователя (всегда student для данного публичного эндпоинта)"
      example:
        email: "student@example.com"
        password: "StudentSecurePass123!"
        full_name: "Иван Иванов"
        role: "student"
    CreateStaffUserRequest:
      type: "object"
      required:
        - "email"
        - "password"
        - "full_name"
        - "role"
      properties:
        email:
          type: "string"
          format: "email"
          example: "instructor@course-platform.local"
        password:
          type: "string"
          minLength: 8
          example: "InstructorSecurePass123!"
        full_name:
          type: "string"
          example: "Алексей Эксперт"
        role:
          type: "string"
          enum:
            - "instructor"
            - "admin"
            - "manager"
          example: "instructor"
          description: "Роль для создания персонала (доступно только Администраторам)"
        bio:
          type: "string"
          example: "Ведущий инженер и эксперт по распределенным системам"
          description: "Биография для профиля преподавателя (опционально)"
        specialization:
          type: "string"
          example: "Go, Kubernetes, Cloud Native"
          description: "Специализация преподавателя (опционально)"
      example:
        email: "alex.devops@course-platform.local"
        password: "Instructor123!"
        full_name: "Алексей Эксперт"
        role: "instructor"
        bio: "Ведущий инженер и эксперт по распределенным системам"
        specialization: "Go, Kubernetes, Cloud Native"
    DeleteUserResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        message:
          type: "string"
          example: "Пользователь успешно удален."
        data:
          type: "object"
          properties:
            id:
              type: "string"
              format: "uuid"
              example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
            email:
              type: "string"
              format: "email"
              example: "deleted_user@example.com"
      example:
        success: true
        message: "Пользователь успешно удален."
        data:
          id: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          email: "deleted_user@example.com"
    LoginRequest:
      type: "object"
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
          format: "email"
          example: "admin@course-platform.local"
        password:
          type: "string"
          example: "AdminSecurePass123!"
      example:
        email: "admin@course-platform.local"
        password: "AdminSecurePass123!"
    CreateCourseRequest:
      type: "object"
      required:
        - "title"
        - "price"
        - "start_date"
        - "max_seats"
      properties:
        title:
          type: "string"
          example: "Архитектура микросервисов на Go и Kubernetes"
        description:
          type: "string"
          example: "Глубокий практический курс по разработке распределенных отказоустойчивых систем на Golang."
        price:
          type: "number"
          example: 45000
        start_date:
          type: "string"
          format: "date-time"
          example: "2026-11-01T10:00:00.000Z"
        max_seats:
          type: "integer"
          example: 30
        instructor_id:
          type: "string"
          example: "instr-uuid-1"
        status:
          type: "string"
          enum:
            - "draft"
            - "published"
            - "archived"
          example: "published"
      example:
        title: "Архитектура микросервисов на Go и Kubernetes"
        description: "Глубокий практический курс по разработке распределенных отказоустойчивых систем на Golang."
        price: 45000
        start_date: "2026-11-01T10:00:00.000Z"
        max_seats: 30
        status: "published"
    UpdateCourseRequest:
      type: "object"
      properties:
        title:
          type: "string"
          example: "Архитектура микросервисов на Go (Обновленный)"
        description:
          type: "string"
          example: "Добавлены модули по gRPC, Kafka и OpenTelemetry."
        price:
          type: "number"
          example: 49000
        start_date:
          type: "string"
          format: "date-time"
          example: "2026-11-15T10:00:00.000Z"
        max_seats:
          type: "integer"
          example: 35
        status:
          type: "string"
          enum:
            - "draft"
            - "published"
            - "archived"
          example: "published"
      example:
        title: "Архитектура микросервисов на Go (Обновленный)"
        description: "Добавлены модули по gRPC, Kafka и OpenTelemetry."
        price: 49000
        start_date: "2026-11-15T10:00:00.000Z"
        max_seats: 35
        status: "published"
    CreateRoleRequest:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
          example: "moderator"
        description:
          type: "string"
          example: "Модератор обучающих курсов и заявок студентов"
      example:
        name: "moderator"
        description: "Модератор обучающих курсов и заявок студентов"
    UpdateRoleRequest:
      type: "object"
      properties:
        name:
          type: "string"
          example: "content_manager"
        description:
          type: "string"
          example: "Управление публикацией учебных программ"
      example:
        name: "content_manager"
        description: "Управление публикацией учебных программ"
    UpdateRolePermissionsRequest:
      type: "object"
      required:
        - "permission_ids"
      properties:
        permission_ids:
          type: "array"
          items:
            type: "string"
          example:
            - "perm-courses-create"
            - "perm-courses-edit"
            - "perm-courses-view-students"
      example:
        permission_ids:
          - "perm-courses-create"
          - "perm-courses-edit"
    AssignRoleRequest:
      type: "object"
      required:
        - "role_id"
      properties:
        role_id:
          type: "string"
          example: "role-uuid-instructor"
      example:
        role_id: "role-uuid-instructor"
    CreateInstructorRequest:
      type: "object"
      required:
        - "user_id"
      properties:
        user_id:
          type: "string"
          example: "usr-uuid-example-1"
        bio:
          type: "string"
          example: "Staff Backend Engineer, архитектор распределенных систем."
        specialization:
          type: "string"
          example: "Golang, Highload, PostgreSQL, Docker"
        rating:
          type: "number"
          example: 4.95
      example:
        user_id: "usr-uuid-example-1"
        bio: "Staff Backend Engineer, архитектор распределенных систем."
        specialization: "Golang, Highload, PostgreSQL, Docker"
        rating: 4.95
    UpdateInstructorRequest:
      type: "object"
      properties:
        bio:
          type: "string"
          example: "Главный технический руководитель направления Cloud-Native."
        specialization:
          type: "string"
          example: "Golang, Kubernetes, Distributed Systems"
        rating:
          type: "number"
          example: 5
      example:
        bio: "Главный технический руководитель направления Cloud-Native."
        specialization: "Golang, Kubernetes, Distributed Systems"
        rating: 5
    CreateEnrollmentRequest:
      type: "object"
      required:
        - "course_id"
      properties:
        course_id:
          type: "string"
          example: "course-uuid-golang"
      example:
        course_id: "course-uuid-golang"
    AddCardRequest:
      type: "object"
      required:
        - "card_number"
        - "card_holder"
        - "exp_month"
        - "exp_year"
        - "cvv"
      properties:
        card_number:
          type: "string"
          example: "4532758812345678"
          description: "16-значный номер банковской карты"
        card_holder:
          type: "string"
          example: "IVAN IVANOV"
          description: "Имя держателя карты латиницей"
        exp_month:
          type: "string"
          example: "12"
          description: "Месяц окончания (01-12)"
        exp_year:
          type: "string"
          example: "2028"
          description: "Год окончания (YYYY)"
        cvv:
          type: "string"
          example: "789"
          description: "3 или 4 цифры кода CVV"
        is_default:
          type: "boolean"
          example: true
      example:
        card_number: "4532758812345678"
        card_holder: "IVAN IVANOV"
        exp_month: "12"
        exp_year: "2028"
        cvv: "789"
        is_default: true
    CheckoutPaymentRequest:
      type: "object"
      required:
        - "enrollment_id"
      properties:
        enrollment_id:
          type: "string"
          example: "enr-uuid-1234"
        payment_method_id:
          type: "string"
          example: "card-uuid-5678"
      example:
        enrollment_id: "enr-uuid-1234"
        payment_method_id: "card-uuid-5678"
    TokenResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        data:
          type: "object"
          properties:
            access_token:
              type: "string"
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      example:
        success: true
        data:
          access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiJ1c3ItMSIsInJvbGUiOiJzdHVkZW50In0..."
    AuthResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        message:
          type: "string"
          example: "Аутентификация успешна."
        data:
          type: "object"
          properties:
            access_token:
              type: "string"
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            user:
              type: "object"
              required:
                - "id"
                - "email"
                - "full_name"
                - "role"
              properties:
                id:
                  type: "string"
                  example: "usr-uuid-1"
                email:
                  type: "string"
                  example: "admin@course-platform.local"
                full_name:
                  type: "string"
                  example: "Администратор Системы"
                role:
                  type: "object"
                  required:
                    - "id"
                    - "name"
                    - "permissions"
                  properties:
                    id:
                      type: "string"
                      example: "role-uuid-admin"
                    name:
                      type: "string"
                      example: "admin"
                    description:
                      type: "string"
                      example: "Полный администратор платформы"
                    permissions:
                      type: "array"
                      items:
                        type: "string"
                      example:
                        - "users:view_all"
                        - "users:manage_roles"
                        - "roles:manage"
                        - "courses:create"
                        - "payments:view_all"
      example:
        success: true
        message: "Аутентификация успешна."
        data:
          access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiJ1c3ItMSIsInJvbGUiOiJhZG1pbiJ9..."
          user:
            id: "usr-uuid-1"
            email: "admin@course-platform.local"
            full_name: "Администратор Системы"
            role:
              id: "role-uuid-admin"
              name: "admin"
              description: "Полный администратор платформы"
              permissions:
                - "users:view_all"
                - "users:manage_roles"
                - "roles:manage"
                - "courses:create"
                - "payments:view_all"
    CurrentUserResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        data:
          type: "object"
          properties:
            id:
              type: "string"
              example: "usr-uuid-1"
            email:
              type: "string"
              example: "admin@course-platform.local"
            full_name:
              type: "string"
              example: "Администратор Системы"
            role:
              type: "object"
              required:
                - "id"
                - "name"
                - "permissions"
              properties:
                id:
                  type: "string"
                  example: "role-uuid-admin"
                name:
                  type: "string"
                  example: "admin"
                description:
                  type: "string"
                  example: "Полный администратор платформы"
                permissions:
                  type: "array"
                  items:
                    type: "string"
                  example:
                    - "users:view_all"
                    - "roles:manage"
            created_at:
              type: "string"
              example: "2026-10-04T00:00:00.000Z"
      example:
        success: true
        data:
          id: "usr-uuid-1"
          email: "admin@course-platform.local"
          full_name: "Администратор Системы"
          role:
            id: "role-uuid-admin"
            name: "admin"
            description: "Полный администратор платформы"
            permissions:
              - "users:view_all"
              - "users:manage_roles"
              - "roles:manage"
              - "courses:create"
              - "payments:view_all"
          created_at: "2026-10-04T00:00:00.000Z"
    UserResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        data:
          type: "object"
          required:
            - "id"
            - "email"
            - "full_name"
            - "role"
          properties:
            id:
              type: "string"
              example: "usr-uuid-1"
            email:
              type: "string"
              example: "student@example.com"
            full_name:
              type: "string"
              example: "Иван Иванов"
            role:
              type: "object"
              required:
                - "id"
                - "name"
                - "permissions"
              properties:
                id:
                  type: "string"
                  example: "role-uuid-student"
                name:
                  type: "string"
                  example: "student"
                description:
                  type: "string"
                  example: "Слушатель курсов"
                permissions:
                  type: "array"
                  items:
                    type: "string"
                  example:
                    - "courses:view"
                    - "enrollments:create"
                    - "enrollments:view_my"
            courses:
              type: "array"
              items:
                type: "object"
              example:
                - id: "course-1"
                  title: "Основы Golang"
                  status: "confirmed"
      example:
        success: true
        data:
          id: "usr-uuid-1"
          email: "student@example.com"
          full_name: "Иван Иванов"
          role:
            id: "role-uuid-student"
            name: "student"
            description: "Слушатель курсов"
            permissions:
              - "courses:view"
              - "enrollments:create"
              - "enrollments:view_my"
          enrollments:
            - id: "enr-1"
              status: "confirmed"
              course:
                id: "c-1"
                title: "Основы Go"
                price: 30000
    UserListResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        data:
          type: "object"
          properties:
            total:
              type: "integer"
              example: 12
            users:
              type: "array"
              items:
                $ref: "#/components/schemas/UserResponse"
      example:
        success: true
        data:
          total: 2
          users:
            - id: "usr-1"
              email: "admin@course-platform.local"
              full_name: "Администратор Системы"
              role:
                name: "admin"
            - id: "usr-2"
              email: "student@example.com"
              full_name: "Иван Иванов"
              role:
                name: "student"
    RoleResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        data:
          type: "object"
          properties:
            id:
              type: "string"
              example: "role-uuid-instructor"
            name:
              type: "string"
              example: "instructor"
            description:
              type: "string"
              example: "Преподаватель курсов"
            permissions:
              type: "array"
              items:
                type: "object"
              example:
                - id: "perm-1"
                  code: "courses:create"
                  description: "Создание курсов"
                - id: "perm-2"
                  code: "courses:edit"
                  description: "Редактирование своих курсов"
      example:
        success: true
        data:
          id: "role-uuid-instructor"
          name: "instructor"
          description: "Преподаватель курсов"
          permissions:
            - id: "perm-1"
              code: "courses:create"
              description: "Создание курсов"
            - id: "perm-2"
              code: "courses:edit"
              description: "Редактирование своих курсов"
            - id: "perm-3"
              code: "courses:view_students"
              description: "Просмотр студентов курса"
    RoleListResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/RoleResponse"
      example:
        success: true
        data:
          - id: "role-1"
            name: "admin"
            description: "Полный администратор платформы"
          - id: "role-2"
            name: "instructor"
            description: "Преподаватель курсов"
          - id: "role-3"
            name: "student"
            description: "Студент / Слушатель"
    AssignRoleResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        message:
          type: "string"
          example: "Пользователю успешно назначена роль instructor."
        data:
          type: "object"
          properties:
            user_id:
              type: "string"
              example: "usr-uuid-1"
            email:
              type: "string"
              example: "student@example.com"
            role:
              type: "string"
              example: "instructor"
      example:
        success: true
        message: "Пользователю успешно назначена роль instructor."
        data:
          user_id: "usr-uuid-1"
          email: "student@example.com"
          role: "instructor"
    PermissionListResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        data:
          type: "array"
          items:
            type: "object"
            properties:
              id:
                type: "string"
              code:
                type: "string"
              category:
                type: "string"
              description:
                type: "string"
      example:
        success: true
        data:
          - id: "p-1"
            code: "users:view_all"
            category: "users"
            description: "Просмотр всех пользователей"
          - id: "p-2"
            code: "courses:create"
            category: "courses"
            description: "Создание новых обучающих курсов"
          - id: "p-3"
            code: "roles:manage"
            category: "roles"
            description: "Управление ролями и правами RBAC"
    CourseResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        data:
          type: "object"
          properties:
            id:
              type: "string"
              example: "c-uuid-1"
            title:
              type: "string"
              example: "Разработка на Go и TypeScript"
            description:
              type: "string"
              example: "Практический интенсив"
            price:
              type: "number"
              example: 45000
            start_date:
              type: "string"
              example: "2026-11-01T10:00:00.000Z"
            max_seats:
              type: "integer"
              example: 25
            available_seats:
              type: "integer"
              example: 24
            status:
              type: "string"
